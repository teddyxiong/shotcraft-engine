[package]
name = "shotcraft-engine"
version = "0.1.3"
edition = "2024"
rust-version = "1.95"
license-file = "LICENSE"
repository = "https://github.com/teddyxiong/shotcraft-engine"
publish = false
description = "Synchronous cross-platform scrolling screenshot capture"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[dependencies]
base64 = "0.23"
enigo = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
thiserror = "2"
xcap = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", features = ["randr"] }

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
